function renderResume() {
  const slot = document.getElementById('resumeSlot');

  if (!slot || !r || T.s.stage >= 1) return;
  slot.innerHTML = `<div class="note resume"><b>上次答到第 ${r.lastQ} 題</b><span>要從第 ${Math.min(r.lastQ + 1, TOTAL)} 題接續嗎？</span>

  document.getElementById('resumeGo').onclick = () => {

    T.set({ stage: 1, lastQ: r.lastQ, resumedFrom: r.id }, true);
    T.resume = null;
    go(Math.min(r.lastQ, TOTAL - 1));
  };

}

function go(i) { idx = i; renderQ(); T.screen('q' + (i + 1)); top0(); }

function next() {
  const v = answers[QUESTIONS[idx].id];
  T.answered(idx, typeof v === 'object' ? (QUESTIONS[idx].type === 'pref' ? prefText(v) : v) : v);
  if (idx < TOTAL - 1) go(idx + 1); else finish();
}

function chooseSingle(q, v) {
  const prev = answers[q.id];
  if (prev !== undefined && prev !== v) { T.s.changes++; T.ev('change', q.id, { from: prev, to: v }); }
  answers[q.id] = v;
  if (q.id === 'q1' && prev && (isOther({ q1: prev }) !== isOther(answers))) {
    ['q2', 'q3', 'q4', 'q5'].forEach(k => delete answers[k]);
  }
  if (q.id === 'q9' && v === 'yes') { T.answered(idx, v); setBar(TOTAL); showResult(); return; }
  next();
}

function head(q) {
  return `<div class="eyebrow">${esc(PARTS[q.part])}　·　${idx + 1} / ${TOTAL}</div><h2>${esc(q.title(answers))}</h2>`;
}

function backLink() {
  return `<div class="nav"><button class="link" id="back">上一題</button></div>`;
}
function bindBack() {
  const b = document.getElementById('back');
  if (b) b.onclick = () => { T.s.backs++; T.ev('back', 'q' + (idx + 1)); if (idx > 0) go(idx - 1); else { T.screen('intro'); renderIntro(); } };
}

function renderQ() {
  const q = QUESTIONS[idx];
  setBar(idx);
  if (q.type === 'courses') return renderCourses(q);
  if (q.type === 'pref') return renderPref(q);
  const opts = q.options(answers);
  app.innerHTML = `<section class="q">${head(q)}

    ${backLink()}</section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    app.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    setTimeout(() => chooseSingle(q, b.dataset.v), 160);
  });
  bindBack();
}

const PLACE_LABEL = { taipei: '台北旗艦店（中山）', other: '外縣市' };

function prefText(p) {
  if (!p) return '';
  const parts = [];
  if (p.place) parts.push(PLACE_LABEL[p.place] + (p.place === 'other' && p.city ? '：' + (p.city === '其他' ? (p.cityOther || '其他') : p.city) : ''));
  if (p.time) parts.push(TIME_LABEL[p.time] + (p.time === 'weekday' && p.slot ? '：' + p.slot : ''));
  return parts.join('・');
}

/* ---------- 推薦邏輯 ---------- */
function planFor(key, start, end) {
  const c = COURSES[key];
  const lv = []; for (let i = start; i <= end; i++) lv.push(i);
  let label, price;
  if (start === 1 && end === 1) { label = '單堂 LEVEL 1'; price = c.single[0]; }
  else if (start === 1 && end === 2) { label = '必修 LEVEL 1+2'; price = c.pack12; }
  else if (start === 1 && end === 3) { label = '全修 LEVEL 1+2+3'; price = c.pack123; }
  else if (start === end) { label = `單階 LEVEL ${start}`; price = c.single[start - 1]; }
  else { label = `LEVEL ${lv.join('+')}（單階合計）`; price = lv.reduce((s, i) => [s[0] + c.single[i - 1][0], s[1] + c.single[i - 1][1]], [0, 0]); }
  return { key, start, end, levels: lv, label, price };
}

function compute(a) {
  const trace = [];
  const branch = isOther(a) ? 'other' : 'self';
  const done = new Set(a.q8?.done || []);
  const target = a.q2;
  const c = COURSES[target];
  const pro = a.q6 && a.q6 !== 'general';
  const r = { branch, target, trace };
  trace.push(`Q1 → ${branch === 'other' ? '他人分支' + (a.q1 === 'both' ? '（兩者都有，標記帶人者）' : '') : '自我分支'}`);
  trace.push(`Q2 → 主推系列：${c.name}`);

  const doneAll = Array.from({ length: c.levels }, (_, i) => done.has(target + (i + 1))).every(Boolean);
  let start = 1; while (start <= c.levels && done.has(target + start)) start++;
  if (a.q9 === 'yes') { r.type = 'B'; trace.push('Q9 有急性不適 → 結果頁 B'); }
  else if (doneAll) { r.type = 'C'; trace.push(`已完成${c.name}全部等級 → 結果頁 C`); return r; }
  else r.type = 'A';

  const want = Number(a.q5 || 1);
  const capped = Math.min(want, c.levels);
  if (want > c.levels) trace.push(`Q5 選判斷層，但${c.name}最高到 LEVEL ${c.levels} → 改推到 LEVEL ${c.levels}`);
  const end = Math.max(start, capped);
  if (start > 1) trace.push(`Q8 已完成至 LEVEL ${start - 1} → 起點 LEVEL ${start}`);
  r.plan = planFor(target, start, end);
  r.depth = DEPTH[want - 1];
  r.visionText = (QUESTIONS[4].options(a).find(o => o[0] === a.q5) || [])[1] || '';
  trace.push(`Q5 ${r.depth}層 → ${r.plan.label}`);

  const path = [];
  path.push({ lab: '現在開始', what: `${c.name}認證｜${r.plan.label}`, rs: '最符合你現在的目標與投入程度。' });
  if (end < c.levels) path.push({ lab: '下一步', what: `${c.name}認證 LEVEL ${end + 1}｜${LV_NAME[end]}`, rs: '完成後往下一個層級深化。' });
  const notRec = [];
  if (target === 'anmo' && want === 3) {
    if (!done.has('shoufa1')) path.push({ lab: '下一步', what: '結構手法認證 LEVEL 1', rs: '想走到能獨立判斷的層級，從局部放鬆升級到整體調整。' });
    notRec.push('結構按摩到「理解」層為止。想走到能獨立判斷的層級，下一步是結構手法。');
    trace.push('按摩＋判斷層 → 延伸結構手法');
  }
  if (target === 'shunshi' && want === 3) {
    notRec.push('順勢訓練最高到 LEVEL 2。想再往判斷層走，結構原力 LEVEL 3 是延伸方向。');
    trace.push('順勢＋判斷層 → 延伸原力 LEVEL 3');
  }
  if (a.q6 === 'general' && target === 'shoufa') notRec.push('結構手法是為以雙手維生的身體工作者設計；如果主要是照顧家人朋友，結構按摩會更貼近你的需求。');

  const compMap = branch === 'self'
    ? { release: 'yuanli', train: 'xunlian', coord: 'shunshi', limit: 'shunshi' }
    : { release: 'anmo', train: 'xunlian', coord: 'shunshi', limit: 'shunshi' };
  const comp = compMap[a.q4];
  r.compSame = comp === target;
  if (comp && comp !== target) {
    const cc = COURSES[comp];
    let cs = 1; while (cs <= cc.levels && done.has(comp + cs)) cs++;
    if (cs <= cc.levels) { r.comp = { key: comp, lv: cs }; trace.push(`Q4 身體狀態對應${cc.name} → 列入「未來可以」`); }
  } else if (r.compSame) trace.push('Q4 與 Q2 指向同一門課 → 推薦理由加一句肯定');

  const yL3 = (branch === 'other' && want === 3 && pro && !done.has('yuanli3') && target !== 'yuanli') || (target === 'shunshi' && want === 3 && !done.has('yuanli3'));
  if (yL3) trace.push('帶人者＋判斷層＋專業身份 → 原力 LEVEL 3 列入「未來可以」');
  const future = [];
  if (yL3) future.push({ lab: '未來可以', what: '結構原力認證 LEVEL 3｜高階應用', rs: '適合已經能清楚感知自己身體、又需要帶學員的你——在動態中維持良好姿態，也更能引導學員感知。' });
  if (r.comp) future.push({ lab: '未來可以', what: `${COURSES[r.comp.key].name}認證 LEVEL ${r.comp.lv}`, rs: '對應你描述的身體狀態，和現在這堂課互補。' });
  while (path.length < 3 && future.length) path.push(future.shift());
  r.path = path.slice(0, 3);
  r.notRec = notRec;

  const oneOnOne = a.q7 === 'yes', took = a.q8?.took === 'yes';
  r.who = oneOnOne && took ? '老學員' : oneOnOne ? '一對一學員，首次進修' : took ? '認證課學員' : '第一次接觸';
  trace.push(`Q7＋Q8 → 開場身份：${r.who}`);
  r.firstTime = !oneOnOne && !took;
  if (r.firstTime) {
    r.entryVersion = pro ? '專業' : '一般';
    r.entryOrder = target === 'yuanli' ? ['one'] : a.q3 === 'none' ? ['yuanli', 'one'] : ['one', 'yuanli'];
    trace.push(`第一次接觸 → 顯示入口區塊（${r.entryVersion}版，${r.entryOrder[0] === 'one' ? '一對一體驗' : '結構原力'}在前）`);
  }
  r.highIntent = branch === 'other' && want === 3 && pro;
  if (r.highIntent) trace.push('他人分支＋判斷層＋專業身份 → 標記高意向名單，小編當日聯繫');
  r.pain = PAIN[branch][target];
  if (a.q10?.place === 'other' || a.q10?.time === 'weekday') trace.push(`Q10 ${prefText(a.q10)} → 標記加開梯次需求`);
  return r;
}

function bindLead(onDone) {
  const f = document.getElementById('lead');
  if (!f) return;
  f.addEventListener('input', () => { document.getElementById('ld-err').hidden = true; });
  f.addEventListener('change', () => { document.getElementById('ld-err').hidden = true; });
  // 只記錄「開始填寫」，不記錄還沒送出的內容
  f.addEventListener('focusin', () => { if (!T.leadStarted) { T.leadStarted = true; T.ev('lead_start', null, { screen: T.s.screen }); } });
  f.onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById('ld-err');
    const n = document.getElementById('ld-name').value.trim(), p = document.getElementById('ld-phone').value.trim(), m = document.getElementById('ld-mail').value.trim();
    let msg = '';
    if (!n || !p || !m) msg = '請填寫姓名、手機與信箱';
    else if (!/^09\d{8}$/.test(p.replace(/[-\s]/g, ''))) msg = '手機請填 09 開頭的 10 碼號碼';
    else if (!/^\S+@\S+\.\S+$/.test(m)) msg = '信箱格式看起來不對，請再確認';
    else if (!document.getElementById('ld-ok').checked) msg = '請勾選同意個資蒐集';
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    const btn = f.querySelector('button[type=submit]'); const label = btn.innerHTML;
    btn.disabled = true; btn.textContent = '送出中…';
    let ok = false;
    try {
      if (T.sid) {
        await Promise.all([T.push(), T.flush()]);
        const r = await fetch(`/api/session/${T.sid}/lead`, { method: 'POST',
          headers: { 'content-type': 'application/json', 'x-session-token': T.token },
          body: JSON.stringify({ name: n, phone: p, email: m, consent: true }) });
        ok = r.ok;
      }
    } catch {}
    btn.disabled = false; btn.innerHTML = label;
    if (!ok) { err.textContent = '暫時無法送出，請稍後再試，或透過 LINE 直接聯繫我們。'; err.hidden = false; T.ev('lead_error'); return; }
    if (T.s.screen === 'gate' && !T.s.gateAction) T.s.gateAction = 'submit';
    T.s.stage = 4;
    lead = { done: true, skipped: lead.skipped, name: n };
    onDone();
  };
}

  const btn = lead.done ? '' : '<button class="btn" data-tolead>留下資料，我們與你聯繫</button>';
  return `<p class="opening">${lead.done ? esc(lead.name) + '，' : ''}你已經完成${c.name}的所有課程，而你仍然在意這個方向——這代表你正在這條路上持續深入。我們為你準備了兩個下一步：</p>
    ${lead.done ? doneBanner(r) : ''}
    <section class="card"><h3>回來複訓</h3><p>學過一次，和真正內化，中間往往還有一段距離。我們以非常優惠的價格歡迎你回到課堂，把還沒完全搞懂的部分釐清，用現在的你重新理解當時學過的內容。</p>
      <div class="nav">${btn}<button class="btn ghost" data-mock>私訊小編了解更多</button></div></section>
    <section class="card"><h3>成為師資</h3><p>對這個面向有無止盡的探求，代表你已經走在成為師資的路上。如果你想把這套結構思維傳遞給更多人，我們想和你聊聊。</p>
      <div class="nav">${btn}<button class="btn ghost" data-mock>私訊小編了解更多</button></div></section>
    ${lead.done ? '' : leadCard(r)}`;
}
function answerSummary(a) {
  return QUESTIONS.map(q => {
    let v;
    if (q.type === 'courses') v = a.q8 ? (a.q8.took === 'yes' ? '上過：' + a.q8.done.map(x => COURSES[x.slice(0, -1)].name + ' L' + x.slice(-1)).join('、') : '還沒有') : '—';
    else if (q.type === 'pref') v = a.q10 ? prefText(a.q10) || '略過' : '—';
    else v = ((q.options(a) || []).find(o => o[0] === a[q.id]) || [])[1] || '—';
    return `${q.id.toUpperCase()}　${q.title(a)}\n　→ ${v}`;
  }).join('\n');
}

function resultLine(r) {
  const c = COURSES[r.target];
  if (r.type === 'C') return `結果頁 C：已完成${c.name}全系列 → 複訓／成為師資`;
  return `結果頁 ${r.type}：${c.name}認證｜${r.plan.label}` + (r.path ? `\n路徑：${r.path.map(s => s.lab + ' ' + s.what).join(' → ')}` : '');
}

function feedbackCard() {
  const opts = ['結構原力', '結構訓練', '順勢訓練', '結構手法', '結構按摩', '一對一服務', '不確定'];
  return `<section class="card fb"><h3>試填回饋：這個推薦準嗎？</h3>
    <form id="fb" novalidate>
      <label class="f" for="fb-who">你的稱呼（例：Eason／模擬某位學員）<input type="text" id="fb-who" maxlength="40"></label>
      <div class="f">推薦結果<div class="radios">
        <label for="fb-a1"><input type="radio" name="acc" id="fb-a1" value="準確">準確</label>
        <label for="fb-a2"><input type="radio" name="acc" id="fb-a2" value="部分準確">部分準確</label>
        <label for="fb-a3"><input type="radio" name="acc" id="fb-a3" value="不準確">不準確</label></div></div>
      <label class="f" for="fb-exp">你預期應該推薦哪一堂？<select id="fb-exp"><option value="">（與結果相同可不選）</option>${opts.map(o => `<option>${o}</option>`).join('')}</select></label>
      <label class="f" for="fb-txt">題目、選項或文案的意見<textarea id="fb-txt" maxlength="1500" placeholder="例：Q4 第四個選項看不懂；推薦理由太長"></textarea></label>
      <p class="err" id="fb-err" hidden></p>
      <button class="btn" type="submit" id="fb-send">送出回饋</button>
      <p class="okmsg" id="fb-ok" hidden></p>
    </form>
    <div id="fb-copy" hidden>
      <p style="font-size:14px">沒辦法直接送出？把下面這段複製給 Cico 也可以：</p>
      <div class="copybox" id="fb-text"></div>
      <button class="btn ghost" id="fb-copybtn" type="button">複製內容</button>
    </div>
  </section>`;
}

function traceCard(r, a) {
  return `<details class="trace card"><summary>推薦邏輯追蹤（測試用）</summary>
    <ol>${r.trace.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
    <div class="copybox" style="margin-top:10px">${esc(answerSummary(a))}</div></details>`;
}

function bindMocks() {
  app.querySelectorAll('[data-mock]').forEach(b => {
    b.dataset.orig = b.innerHTML;
    b.addEventListener('click', () => {
      if (b.dataset.flash) return;
      b.dataset.flash = 1; b.textContent = '原型展示：正式版會開啟這個連結';
      setTimeout(() => { b.innerHTML = b.dataset.orig; delete b.dataset.flash; }, 1600);
    });
  });
}

function scrollToLead() {
  const card = document.getElementById('leadcard');
  if (!card) return;
  card.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  setTimeout(() => document.getElementById('ld-name')?.focus({ preventScroll: true }), 350);
}

function showResult() {
  setBar(TOTAL);
  const a = answers;
  const r = compute(a);
  lastResult = r;
  const body = r.type === 'B' ? pageB(r) : r.type === 'C' ? pageC(r) : pageA(r, a);
  const sticky = r.type !== 'B' && !lead.done;
  app.innerHTML = `<div class="wrap" style="padding-block:8px">${body}
    <p class="mock" style="text-align:center">對結果有疑問？透過 LINE 問我們。</p>
    ${CFG.trial ? feedbackCard() + traceCard(r, a) : ''}
    <div class="nav"><button class="btn ghost wide" id="again">${CFG.trial ? '用另一個身份再測一次' : '重新測驗'}</button></div>
    ${sticky ? '<div class="stickpad"></div>' : ''}</div>
    ${sticky ? `<div class="sticky" id="sticky"><button class="btn wide cta" data-tolead>${r.type === 'C' ? '留下資料，取得校友專屬方案' : '點我卡位超早鳥最優惠價格'} <span class="arrow" aria-hidden="true">${ARROW}</span></button></div>` : ''}`;
  bindMocks(); bindLine();
  app.querySelectorAll('[data-tolead]').forEach(b => b.onclick = () => { T.s.ctaClicks++; T.ev('cta', null, { to: 'lead', from: b.id || b.className }); T.set({}); scrollToLead(); });
  bindLead(showResult);
  T.s.result = resultForTrack(r);
  if (T.s.stage < 2) T.s.stage = 2;
  T.screen('result'); T.ev('result_view', null, { type: r.type, lead: lead.done });
  // 標記各段落，追蹤捲到哪裡
  const mark = (sel, k) => { const el = app.querySelector(sel); if (el) el.dataset.track = k; };
  mark('.hero', 'hero'); mark('.why', 'why'); mark('.journey', 'journey'); mark('#leadcard', 'lead');
  mark('.entry', 'entry'); mark('.fb', 'feedback');
  const pc = app.querySelector('.path'); if (pc) pc.closest('.card').dataset.track = 'path';
  trackDepth();
  const st = document.getElementById('sticky'), card = document.getElementById('leadcard');
  if (st && card && 'IntersectionObserver' in window) {
    new IntersectionObserver(es => es.forEach(e => st.classList.toggle('off', e.isIntersecting)), { threshold: 0.15 }).observe(card);
  }
  if (CFG.trial) bindFeedback(r, a);
  document.getElementById('again').onclick = () => { T.ev('restart'); renderIntro(); };
  top0();
}
/* ---------- 試填回饋 ---------- */
function bindFeedback(r, a) {
  const f = document.getElementById('fb');
  const err = document.getElementById('fb-err');
  f.addEventListener('input', () => { err.hidden = true; });
  f.addEventListener('change', () => { err.hidden = true; });
  f.onsubmit = async e => {
    e.preventDefault();
    const acc = f.querySelector('input[name=acc]:checked')?.value;
    if (!acc) { err.textContent = '請先選擇推薦結果準不準'; err.hidden = false; return; }
    const who = document.getElementById('fb-who').value.trim();
    const exp = document.getElementById('fb-exp').value;
    const txt = document.getElementById('fb-txt').value.trim();
    const rec = {
      at: new Date().toISOString(), tester: who || '未署名', accuracy: acc, expected: exp, comment: txt,
      result: resultLine(r), resultType: r.type, course: COURSES[r.target].name, plan: r.plan?.label || '',
      answers: answerSummary(a), lead: lead.done ? '有留資料' : lead.skipped ? '略過留資料' : '—'
    };
    const send = document.getElementById('fb-send');
    send.disabled = true; send.textContent = '送出中…';
    let saved = false;
    try {
      if (T.sid) {
        const res = await fetch(`/api/session/${T.sid}/feedback`, { method: 'POST',
          headers: { 'content-type': 'application/json', 'x-session-token': T.token },
          body: JSON.stringify({ tester: rec.tester, accuracy: acc, expected: exp, comment: txt }) });
        saved = res.ok;
      }
    } catch (e2) { saved = false; }
    send.disabled = false; send.textContent = '送出回饋';
    const ok = document.getElementById('fb-ok');
    const text = `【結構測驗試填回饋】\n試填者：${rec.tester}\n留資料：${rec.lead}\n推薦：${acc}${exp ? '（預期：' + exp + '）' : ''}\n意見：${txt || '無'}\n\n${rec.result}\n\n${rec.answers}`;
    if (saved) { ok.textContent = '已送出，謝謝你的回饋！可以換一個身份再測一次。'; ok.hidden = false; document.getElementById('fb-copy').hidden = true; }
    else {
      ok.hidden = true;
      document.getElementById('fb-text').textContent = text;
      document.getElementById('fb-copy').hidden = false;
    }
  };
  document.getElementById('fb-copybtn').onclick = async () => {
    const box = document.getElementById('fb-text');
    try { await navigator.clipboard.writeText(box.textContent); document.getElementById('fb-copybtn').textContent = '已複製'; }
    catch (e) { const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(box); s.removeAllRanges(); s.addRange(rg); document.getElementById('fb-copybtn').textContent = '已選取，請按複製'; }
  };
}

/* ================= 設定、LIFF 與追蹤 ================= */
let CFG = { liffId: '', trial: false, oaBasicId: '' };
const T = {
  sid: null, token: null, profile: null, resume: null, ready: null, started: false, queue: [], timer: null, ptimer: null,
  envInfo: null, source: null, idToken: null, anonId: null,
  s: null,
  reset() {
    this.s = { stage: 0, lastQ: 0, screen: 'intro', qTimes: {}, backs: 0, changes: 0, ctaClicks: 0,
      resultDepth: null, gateAction: null, result: null, resumedFrom: null };
    this.qShownAt = 0; this.seen = new Set(); this.leadStarted = false;
  },
  async open() {
    try { this.anonId = localStorage.getItem('sq_anon'); if (!this.anonId) { this.anonId = crypto.randomUUID(); localStorage.setItem('sq_anon', this.anonId); } }
    catch { this.anonId = null; }
    try { const r = await fetch('/api/config'); if (r.ok) CFG = { ...CFG, ...(await r.json()) }; } catch {}
    await initLiff();
    this.source = readSource();
    this.envInfo = readEnv();
    return this.startSession();
  },
  async startSession() {
    this.sid = null; this.token = null;
    try {
      const r = await fetch('/api/session/start', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ idToken: this.idToken, anonId: this.anonId, env: this.envInfo, source: this.source, trial: CFG.trial }) });
      if (!r.ok) throw new Error('start ' + r.status);
      const d = await r.json();
      this.sid = d.sessionId; this.token = d.token; this.profile = d.profile || this.profile; this.resume = d.resume;
      if (this.s.stage > 0 || this.s.screen !== 'intro') this.push();
      this.flush();
    } catch (e) { /* 沒有後端時（例如本機直接開檔），追蹤安靜地停用 */ }
    return this;
  },
  ev(type, q, payload) {
    this.queue.push({ type, q: q || null, payload: payload || null, at: new Date().toISOString() });
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500);
  },
  set(patch, now) {
    Object.assign(this.s, patch);
    clearTimeout(this.ptimer);
    this.ptimer = setTimeout(() => this.push(), now ? 0 : 400);
  },
  snapshot() {
    return { ...this.s, answers, q10Pref: prefText(answers.q10) || null };
  },
  async push() {
    if (!this.sid) return;
    try { await fetch(`/api/session/${this.sid}/progress`, { method: 'POST', keepalive: true,
      headers: { 'content-type': 'application/json', 'x-session-token': this.token }, body: JSON.stringify(this.snapshot()) }); } catch {}
  },
  async flush() {
    if (!this.sid || !this.queue.length) return;
    const events = this.queue.splice(0, 60);
    try { await fetch(`/api/session/${this.sid}/events`, { method: 'POST', keepalive: true,
      headers: { 'content-type': 'application/json', 'x-session-token': this.token }, body: JSON.stringify({ events }) }); }
    catch { this.queue.unshift(...events); }
    if (this.queue.length) this.flush();
  },
  /* 離開或切到背景：用 sendBeacon 把剩下的事件和最後進度一起送出（關掉頁面也送得到） */
  beacon(reason) {
    if (!this.sid || this.left) return;
    this.left = true; setTimeout(() => { this.left = false; }, 1500);
    this.queue.push({ type: 'leave', q: this.s.screen, payload: { reason }, at: new Date().toISOString() });
    const body = JSON.stringify({ token: this.token, events: this.queue.splice(0, 60), progress: this.snapshot() });
    const url = `/api/session/${this.sid}/events`;
    if (!(navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' })))) {
      fetch(url, { method: 'POST', keepalive: true, headers: { 'content-type': 'text/plain' }, body }).catch(() => {});
    }
  },
  screen(name) {
    this.s.screen = name;
    if (/^q\d+$/.test(name)) this.qShownAt = performance.now();
    this.set({});
  },
  answered(i, v) {
    const k = 'q' + (i + 1);
    const ms = this.qShownAt ? Math.round(performance.now() - this.qShownAt) : 0;
    this.s.qTimes[k] = (this.s.qTimes[k] || 0) + ms;
    this.ev('answer', k, { v, ms });
    this.set({ lastQ: Math.max(this.s.lastQ, i + 1), stage: Math.max(this.s.stage, 1) });
  }
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') T.beacon('hidden'); });
window.addEventListener('pagehide', () => T.beacon('pagehide'));

async function initLiff() {
  if (!CFG.liffId || !window.liff) return;
  try {
    await Promise.race([liff.init({ liffId: CFG.liffId }), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000))]);
    if (liff.isLoggedIn()) T.idToken = liff.getIDToken();
  } catch (e) { /* LIFF 失敗時照樣可以作答，只是沒有 LINE 身分 */ }
}

function readSource() {
  const p = new URLSearchParams(location.search);
  // LIFF 第一次轉址時，原本的參數放在 liff.state 裡
  const st = p.get('liff.state');
  if (st) { const qi = st.indexOf('?'); if (qi >= 0) new URLSearchParams(st.slice(qi + 1)).forEach((v, k) => { if (!p.has(k)) p.set(k, v); }); }
  const g = k => p.get(k) || undefined;
  const clickIds = {}; ['fbclid', 'gclid', 'ttclid', 'twclid'].forEach(k => { if (p.get(k)) clickIds[k] = p.get(k); });
  return { utm_source: g('utm_source'), utm_medium: g('utm_medium'), utm_campaign: g('utm_campaign'), utm_content: g('utm_content'),
    utm_term: g('utm_term'), ref: g('ref'), entry: g('entry'), clickIds: Object.keys(clickIds).length ? clickIds : undefined,
    landingUrl: location.href.split('#')[0], referrer: document.referrer || undefined };
}

function readEnv() {
  const e = { userAgent: navigator.userAgent, language: navigator.language, screen: `${screen.width}x${screen.height}` };
  try { e.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch {}
  const ua = navigator.userAgent;
  e.os = /iPhone|iPad|iPod/.test(ua) ? 'ios' : /Android/.test(ua) ? 'android' : 'web';
  if (window.liff && CFG.liffId) {
    try {
      e.isInClient = liff.isInClient();
      e.os = liff.getOS() || e.os;
      e.language = (liff.getAppLanguage ? liff.getAppLanguage() : liff.getLanguage()) || e.language;
      e.lineVersion = liff.getLineVersion() || undefined;
      const ctx = liff.getContext();
      if (ctx) { e.contextType = ctx.type; e.viewType = ctx.viewType; }
    } catch {}
  } else e.isInClient = /Line\//.test(ua);
  return e;
}

function resultForTrack(r) {
  const c = COURSES[r.target];
  return { type: r.type, course: c.name, plan: r.plan?.label || (r.type === 'C' ? '已完成全系列' : ''), highIntent: !!r.highIntent,
    branch: r.branch, target: r.target, who: r.who, path: (r.path || []).map(s => s.what) };
}

/* 結果頁看到哪一段 */
const DEPTH_ORDER = ['hero', 'why', 'journey', 'lead', 'path', 'entry', 'line', 'feedback'];
function trackDepth() {
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const k = e.target.dataset.track;
    if (T.seen.has(k)) return;
    T.seen.add(k); T.ev('see', null, { section: k });
    const cur = DEPTH_ORDER.indexOf(T.s.resultDepth);
    if (DEPTH_ORDER.indexOf(k) > cur) T.set({ resultDepth: k });
  }), { threshold: 0.4 });
  app.querySelectorAll('[data-track]').forEach(el => io.observe(el));
}

function oaLink(text) {
  return CFG.oaBasicId ? `https://line.me/R/oaMessage/${encodeURIComponent(CFG.oaBasicId)}/?${encodeURIComponent(text)}` : '';
}
function bindCode() { return T.sid ? T.sid.replace(/-/g, '').slice(0, 6).toUpperCase() : ''; }

/* 先畫出開頭頁，LIFF 與紀錄在背景建立 */
T.reset();
renderIntro();
T.ready = T.open().then(() => { if (idx === -1 && T.s.stage === 0) renderIntro(); });
</script>
